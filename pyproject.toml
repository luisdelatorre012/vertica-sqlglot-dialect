[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vertica-sqlglot-dialect"
version = "0.2.0.dev0"
description = "A coverage-driven Vertica dialect plugin for SQLGlot"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Luis de la Torre" },
]
keywords = ["sql", "sqlglot", "vertica", "opentext", "dialect", "parser", "transpiler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "sqlglot>=30.13.0,<30.14.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15,<2.0",
  "pre-commit>=4.3,<4.4; python_version < '3.10'",
  "pre-commit>=4.6.2,<5; python_version >= '3.10'",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.entry-points."sqlglot.dialects"]
vertica = "sqlglot_vertica.dialect:Vertica"

[project.urls]
Documentation = "https://github.com/luisdelatorre012/vertica-sqlglot-dialect#readme"
Issues = "https://github.com/luisdelatorre012/vertica-sqlglot-dialect/issues"
Repository = "https://github.com/luisdelatorre012/vertica-sqlglot-dialect"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlglot_vertica"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sqlglot_vertica"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["sqlglot_vertica"]
