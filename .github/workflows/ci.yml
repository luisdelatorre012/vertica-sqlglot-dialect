name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest --cov
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m build

  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv .wheel-venv
      - run: .wheel-venv/bin/python -m pip install dist/*.whl
      - run: .wheel-venv/bin/python -m pip check
      - name: Verify entry-point discovery from the built wheel
        run: >-
          .wheel-venv/bin/python -I -c
          "import sys;
          assert 'sqlglot_vertica' not in sys.modules;
          from sqlglot import Dialect, parse_one;
          assert Dialect.get_or_raise('vertica').__class__.__module__ == 'sqlglot_vertica.dialect';
          directed = parse_one('SAVE QUERY SELECT 1', read='vertica');
          assert directed.__class__.__name__ == 'SaveQuery';
          assert directed.sql(dialect='vertica') == 'SAVE QUERY SELECT 1';
          partition = parse_one('ALTER TABLE t PARTITION BY YEAR(ts) REORGANIZE', read='vertica');
          assert partition.__class__.__name__ == 'AlterTablePartition';
          assert partition.sql(dialect='vertica') == 'ALTER TABLE t PARTITION BY YEAR(ts) REORGANIZE'"
